<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App P1 — Bienvenida</title>
  <!-- Bootstrap 5 CSS desde CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Animación suave al cargar */
    main {
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Efecto hover en el texto */
    h1 {
      transition: transform 0.3s ease;
    }

    h1:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body class="bg-light">
  <main class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center p-5 shadow-lg rounded-4 bg-white">
      <h1 class="display-3 fw-bold text-primary mb-3">¡Holi Alice! 💜</h1>
      <p class="lead mt-2 text-dark fs-4">Bienvenida a tu aplicación</p>
      <p class="text-muted mt-2">Todo está listo para empezar ✅</p>
      <hr class="my-4 w-50 mx-auto">
      <button class="btn btn-primary btn-lg px-5 mt-2">
        🚀 Comenzar
      </button>
    </div>
  </main>
  <!-- Bootstrap JS con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
